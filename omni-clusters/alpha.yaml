kind: Cluster
name: alpha
kubernetes:
  version: v1.36.4
talos:
  version: v1.13.9
features:
  useEmbeddedDiscoveryService: true
---
kind: ControlPlane
machineClass:
  name: alpha-control-plane
  size: 3
systemExtensions:
  - siderolabs/qemu-guest-agent
---
kind: Workers
machineClass:
  name: alpha-worker
  size: 3
patches:
  - file: patches/workers-install-disk.yaml
  - file: patches/longhorn-fast.yaml
  - file: patches/longhorn-slow.yaml
  - name: kubelet-ip
    inline:
      machine:
        kubelet:
          nodeIP:
            validSubnets:
              - 10.0.50.0/24
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
