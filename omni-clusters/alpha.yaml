kind: Cluster
name: alpha
kubernetes:
  version: v1.36.4
talos:
  version: v1.13.9
features:
  useEmbeddedDiscoveryService: true
---
kind: ControlPlane
machineClass:
  name: alpha-control-plane
  size: 3
systemExtensions:
  - siderolabs/qemu-guest-agent
---
kind: Workers
machineClass:
  name: alpha-worker
  size: 3
systemExtensions:
  - siderolabs/qemu-guest-agent
