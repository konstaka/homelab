jellyfin:
  persistence:
    media:
      size: "5Gi"
  volumes:
    - name: media
      nfs:
        server: 192.168.3.98
        path: /tank/data/media
  volumeMounts:
    - mountPath: /media
      name: media
      readOnly: true
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: jellyfin-buffering@kubernetescrd
    hosts:
      - host: jellyfin.kohmis.fi
        paths:
          - path: /
            pathType: Prefix
  resources:
    limits:
      cpu: 1500m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
